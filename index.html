<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Focus Nook</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --tx: #fff;
      --gl: rgba(255, 255, 255, .18);
      --bd: rgba(255, 255, 255, .4);
      --ink: #1d2b3a;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --gl: rgba(20, 28, 50, .35);
      }
    }

    :root[data-theme="dark"] {
      --gl: rgba(20, 28, 50, .35);
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background: #1e90c8;
      color: var(--tx);
      font-family: Poppins, system-ui, sans-serif;
      overflow: hidden;
      text-shadow: 0 1px 8px rgba(0, 0, 0, .25);
    }

    .vl {
      position: fixed;
      inset: 0;
      z-index: 0;
      opacity: 0;
      transition: opacity 3s;
    }

    .vl video,
    .vl img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .ov {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, var(--ov, .12));
      z-index: 0;
      pointer-events: none;
    }

    #cv {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      display: block;
    }

    .l {
      position: absolute;
      inset: 0;
      transition: opacity 3s;
      z-index: 0;
    }

    .l svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .rain::after {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(105deg, transparent 0 9px, rgba(255, 255, 255, .28) 9px 10px);
      animation: rn .5s linear infinite;
    }

    .cl {
      animation: dr 90s ease-in-out infinite alternate;
    }

    .cl2 {
      animation-duration: 140s;
    }

    @keyframes dr {
      to {
        transform: translateX(170px);
      }
    }

    .tw {
      animation: tw 3s ease-in-out infinite alternate;
    }

    @keyframes tw {
      from {
        opacity: .2;
      }
      to {
        opacity: 1;
      }
    }

    .ff {
      animation: ff 7s ease-in-out infinite alternate;
    }

    @keyframes ff {
      to {
        transform: translate(45px, -35px);
        opacity: .25;
      }
    }

    .sh {
      animation: sh 9s linear infinite;
      opacity: 0;
    }

    @keyframes sh {
      0%,
      80% {
        opacity: 0;
        transform: translate(0, 0);
      }
      85% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(-320px, 170px);
      }
    }

    @keyframes rn {
      to {
        background-position: -30px 60px;
      }
    }

    .ui {
      position: relative;
      z-index: 1;
      height: 100%;
    }

    .logo {
      position: absolute;
      left: 24px;
      top: 18px;
      font: 600 34px Caveat, cursive;
    }

    .tools {
      position: absolute;
      right: 16px;
      top: 16px;
      display: flex;
      gap: 8px;
      z-index: 3;
    }

    .g {
      background: var(--gl);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--bd);
      border-radius: 18px;
    }

    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
    }

    .ic {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 17px;
      border: 1px solid var(--bd);
      background: var(--gl);
      backdrop-filter: blur(14px);
    }

    .ic:hover,
    .pill:hover {
      background: rgba(255, 255, 255, .35);
    }

    .main {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding-bottom: 70px;
    }

    .pills {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .pill {
      padding: 8px 18px;
      border-radius: 99px;
      border: 1.5px solid #fff;
      background: transparent;
      font-size: 14px;
      font-weight: 600;
    }

    .pill.on {
      background: #fff;
      color: var(--ink);
      text-shadow: none;
    }

    #tm {
      font-size: clamp(76px, 19vw, 210px);
      font-weight: 600;
      line-height: 1;
      letter-spacing: -2px;
      font-variant-numeric: tabular-nums;
    }

    .ctl {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    #go {
      background: #fff;
      color: var(--ink);
      border: 0;
      border-radius: 99px;
      padding: 11px 44px;
      font-weight: 600;
      font-size: 17px;
      text-shadow: none;
    }

    .foc {
      font-size: 14px;
      opacity: .95;
      min-height: 20px;
    }

    .scn {
      font-size: 12px;
      opacity: .85;
    }

    .pl {
      position: absolute;
      left: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      width: min(370px, calc(100% - 32px));
      padding: 12px;
    }

    .row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    #art {
      width: 54px;
      height: 54px;
      border-radius: 12px;
      flex: none;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .25);
    }

    .meta {
      min-width: 0;
      flex: 1;
    }

    .meta b {
      display: block;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta small {
      opacity: .85;
    }

    .bar {
      height: 5px;
      border-radius: 9px;
      background: rgba(255, 255, 255, .3);
      margin: 10px 0 4px;
      overflow: hidden;
    }

    .bar i {
      display: block;
      height: 100%;
      width: 0;
      background: #fff;
      border-radius: 9px;
    }

    .tms {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      opacity: .85;
    }

    .mc {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
    }

    .mc button {
      background: none;
      border: 0;
      font-size: 18px;
      padding: 2px 6px;
    }

    #pp {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #fff;
      color: var(--ink);
      text-shadow: none;
      font-size: 15px;
    }

    input[type=range] {
      width: 64px;
      accent-color: #fff;
      margin-left: auto;
    }

    .pop {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(100% + 8px);
      padding: 12px;
      max-height: 46vh;
      overflow: auto;
      display: none;
      background: rgba(30, 45, 70, .6);
    }

    .pop.show {
      display: block;
    }

    .ar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 7px 0;
    }

    .ar button {
      width: 112px;
      text-align: left;
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 99px;
      border: 1px solid var(--bd);
      background: transparent;
    }

    .ar .on {
      background: #fff;
      color: var(--ink);
      text-shadow: none;
    }

    .ar input {
      flex: 1;
      width: auto;
      margin: 0;
    }

    .tr {
      display: flex;
      justify-content: space-between;
      padding: 7px 8px;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
    }

    .tr:hover,
    .tr.on {
      background: rgba(255, 255, 255, .25);
    }

    .tr small {
      opacity: .8;
    }

    .side {
      position: absolute;
      right: 16px;
      top: 16px;
      z-index: 3;
      width: min(310px, calc(100% - 32px));
      padding: 14px;
      display: none;
      max-height: calc(100% - 200px);
      overflow: auto;
    }

    .side.show {
      display: block;
    }

    .side h3 {
      margin: 0 0 4px;
      font-size: 15px;
    }

    .st {
      font-size: 12px;
      opacity: .9;
      margin-bottom: 10px;
    }

    .side input[type=text] {
      width: 100%;
      padding: 9px 12px;
      border-radius: 12px;
      border: 1px solid var(--bd);
      background: rgba(255, 255, 255, .25);
      color: #fff;
      font: inherit;
      outline: 0;
    }

    ::placeholder {
      color: rgba(255, 255, 255, .8);
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 10px 0 0;
    }

    li {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 6px 4px;
      font-size: 13px;
    }

    li span {
      flex: 1;
      cursor: pointer;
    }

    li.d span {
      text-decoration: line-through;
      opacity: .6;
    }

    li.f span {
      font-weight: 600;
    }

    li b {
      cursor: pointer;
      opacity: .7;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .4);
      display: none;
      place-items: center;
      z-index: 5;
    }

    .modal.show {
      display: grid;
    }

    .card {
      width: min(380px, 92%);
      padding: 22px;
      background: rgba(30, 40, 62, .78);
    }

    .card h3 {
      margin: 0 0 12px;
    }

    .f {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 9px 0;
      font-size: 14px;
    }

    .card input[type=number] {
      width: 70px;
      padding: 6px 8px;
      border-radius: 10px;
      border: 1px solid var(--bd);
      background: rgba(255, 255, 255, .15);
      color: #fff;
      font: inherit;
    }

    .pre {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin: 6px 0 10px;
    }

    .pre button {
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 99px;
      border: 1px solid var(--bd);
      background: transparent;
    }

    .ok {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border: 0;
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      font-weight: 600;
      text-shadow: none;
    }

    @media (max-width: 560px) {
      .main {
        padding-bottom: 190px;
      }
      .logo {
        font-size: 26px;
      }
    }

    :root {
      --ah: 210;
      --as: 55%;
    }

    .pl.g {
      width: min(380px, calc(100% - 32px));
      padding: 16px;
      border-radius: 24px;
      background: hsla(var(--ah), var(--as), 20%, .5);
      border-color: hsla(var(--ah), var(--as), 88%, .28);
      box-shadow: 0 18px 50px hsla(var(--ah), var(--as), 8%, .4);
    }

    .pop.g {
      background: hsla(var(--ah), var(--as), 14%, .9);
      border-radius: 18px;
    }

    .card.g {
      background: hsla(var(--ah), var(--as), 16%, .85);
    }

    .pl .row {
      gap: 14px;
    }

    #art {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      box-shadow: 0 10px 26px hsla(var(--ah), var(--as), 6%, .55);
      transition: transform .4s;
    }

    #art.on {
      animation: pu 3s ease-in-out infinite;
    }

    @keyframes pu {
      50% {
        transform: scale(1.06);
      }
    }

    .meta b {
      font-size: 16px;
      font-weight: 600;
    }

    .meta small {
      font-size: 12px;
      opacity: .8;
    }

    #vz {
      width: 72px;
      height: 32px;
      flex: none;
    }

    .pl .bar {
      position: relative;
      height: 6px;
      overflow: visible;
      margin: 16px 0 6px;
      cursor: pointer;
      background: rgba(255, 255, 255, .22);
    }

    .pl .bar::before {
      content: "";
      position: absolute;
      inset: -10px 0;
    }

    .pl .bar i {
      position: relative;
      background: hsl(var(--ah), var(--as), 82%);
      transition: width .25s linear;
    }

    .pl .bar i::after {
      content: "";
      position: absolute;
      right: -6px;
      top: 50%;
      width: 12px;
      height: 12px;
      margin-top: -6px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 6px rgba(0, 0, 0, .35);
    }

    .pl .mc {
      justify-content: space-between;
      gap: 0;
      margin-top: 12px;
    }

    .pl .mc button {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      padding: 0;
      opacity: .9;
      transition: background .2s, transform .15s;
    }

    .pl .mc button:hover {
      background: rgba(255, 255, 255, .18);
    }

    .pl .mc button:active {
      transform: scale(.92);
    }

    #pp {
      width: 54px !important;
      height: 54px !important;
      background: hsl(var(--ah), var(--as), 90%) !important;
      color: var(--ink) !important;
      opacity: 1 !important;
      box-shadow: 0 6px 18px hsla(var(--ah), var(--as), 8%, .45);
    }

    .vr {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      opacity: .9;
    }

    .vr input {
      flex: 1;
      width: auto;
      margin: 0;
    }

    input[type=range] {
      accent-color: hsl(var(--ah), var(--as), 84%);
    }

    .nd .logo,
    .nd .pl {
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="cv"></canvas>
  <div class="vl" id="v0"></div>
  <div class="vl" id="v1"></div>
  <div class="ov"></div>

  <div class="ui">
    <div class="logo">focus nook</div>

    <div class="main">
      <div class="pills" id="pills">
        <button class="pill on" data-m="deep">deep focus</button>
        <button class="pill" data-m="brk">break</button>
        <button class="pill" data-m="quick">quick</button>
      </div>

      <div id="tm">90:00</div>

      <div class="ctl">
        <button id="go">start</button>
        <button class="ic" id="rs" title="Reset">↻</button>
        <button class="ic" id="st" title="Settings">⚙</button>
      </div>
    </div>

    <div class="pl g">
      <div class="row">
        <div id="art"></div>
        <div class="meta">
          <b id="tn"></b>
          <small id="ta"></small>
        </div>
        <canvas id="vz" width="72" height="32"></canvas>
      </div>

      <div class="bar" id="bar"><i id="pb"></i></div>
      <div class="tms">
        <span id="c1">0:00</span>
        <span id="c2">0:00</span>
      </div>

      <div class="mc">
        <button id="sh" title="Shuffle">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5" />
          </svg>
        </button>
        <button id="pv" title="Previous">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 5h2v14H6zM20 5v14L9 12z" />
          </svg>
        </button>
        <button id="pp" title="Play / pause">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 5v14l11-7z" />
          </svg>
        </button>
        <button id="nx" title="Next">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 5h2v14h-2zM4 5v14l11-7z" />
          </svg>
        </button>
        <button id="ls" title="Playlist">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 6h16M4 12h16M4 18h10" />
          </svg>
        </button>
        <button id="mx" title="Ambient sounds">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0" />
            <circle cx="15" cy="6" r="2" />
            <circle cx="9" cy="12" r="2" />
            <circle cx="17" cy="18" r="2" />
          </svg>
        </button>
      </div>

      <div class="vr">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5 6 9H3v6h3l5 4zM15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" />
        </svg>
        <input type="range" id="vo" min="0" max="1" step=".01" value=".6" aria-label="Volume">
      </div>

      <div class="pop g" id="pls"></div>
      <div class="pop g" id="mix"></div>
    </div>
  </div>

  <div class="modal" id="md">
    <div class="card g">
      <h3>Settings</h3>
      <div class="pre">
        <button data-p="90,20,40">90·20·40</button>
        <button data-p="50,10,25">50·10·25</button>
        <button data-p="25,5,15">Pomodoro</button>
      </div>
      <div class="f">Deep focus (min)<input type="number" id="sd" min="1" max="240"></div>
      <div class="f">Break (min)<input type="number" id="sb" min="1" max="120"></div>
      <div class="f">Quick session (min)<input type="number" id="sq" min="1" max="120"></div>
      <div class="f">Each phase lasts (min)<input type="number" id="sg" min="0.25" max="60" step="0.25"></div>
      <div class="f">Auto-start next session<input type="checkbox" id="sa"></div>
      <div class="f">Chime when done<input type="checkbox" id="sc"></div>
      <div class="f">No distraction (hide logo &amp; music)<input type="checkbox" id="sn"></div>
      <button class="ok" id="sv">Save</button>
    </div>
  </div>

  <script>
    /* ============ CONFIG: put your loop videos / images here ============
       Paths are relative to this index.html. Add as many as you like.
       Supported: .mp4 .webm .ogg (video) and .jpg .png .gif .webp (image).
       Missing files are skipped. If the list is empty (or nothing loads),
       the built-in animated scene cycle plays instead. */
    const BACKGROUNDS = [
      'backgrounds/bg1.mp4',
      'backgrounds/bg2.mp4',
      'backgrounds/bg3.mp4',
      // 'backgrounds/my-cozy-room.webm',
      // {src:'backgrounds/rain.mp4', color:'#6a8fb5'},  // optional: force the player/UI colour for this video
    ];

    const SHUFFLE = false;   // true = random order, false = in the order listed
    const OVERLAY = 0.12;    // 0 to 0.6: slight dark tint so the timer text stays readable

    /* Change interval = Settings > "Change background every (min)" */
    /* ====================================================================== */

    /* Worker-based timers: browsers throttle normal timers in hidden tabs, workers are not throttled */
    const WK = (() => {
      try {
        return new Worker(URL.createObjectURL(new Blob(['const t={};onmessage=e=>{const d=e.data;if(d.s)t[d.id]=setInterval(()=>postMessage(d.id),d.ms);else clearInterval(t[d.id])}'], { type: 'text/javascript' })))
      } catch (e) {
        return null
      }
    })();
    const cbs = {};
    let wid = 0;

    function wInt(fn, ms) {
      if (!WK) return setInterval(fn, ms);
      const id = ++wid;
      cbs[id] = fn;
      WK.postMessage({ s: 1, id, ms });
      return id;
    }

    function wClr(id) {
      if (WK && cbs[id]) {
        delete cbs[id];
        WK.postMessage({ id });
      } else clearInterval(id);
    }

    if (WK) WK.onmessage = e => cbs[e.data] && cbs[e.data]();

    const $ = s => document.querySelector(s);
    const $$ = s => [...document.querySelectorAll(s)];

    const ld = (k, d) => {
      try {
        return JSON.parse(localStorage.getItem(k)) ?? d;
      } catch (e) {
        return d;
      }
    };

    const sv = (k, v) => {
      try {
        localStorage.setItem(k, JSON.stringify(v));
      } catch (e) {}
    };

    const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    let S = Object.assign({deep:25,brk:5,quick:15,auto:true,bg:1,chime:true,nd:false},ld('fn_s',{}));
    let T = ld('fn_t', []);
    let ST = ld('fn_st', {});
    let fid = null;
    let mode = 'deep';
    let last = 'deep';
    let left = S.deep * 60;
    let run = false;
    let end = 0;

    const NM = { deep: 'deep focus', brk: 'break', quick: 'quick' };

    /* ---- living day/night engine ---- */
    const hx = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
    const mx = (a, b, f) => a.map((v, i) => v + (b[i] - v) * f);
    const rg = (c, a = 1) => `rgba(${c.map(Math.round)},${a})`;

    const KS = [

      $('#tn').textContent = t.n;
      $('#ta').textContent = ({
        lofi: 'Lo-fi beats',
        piano: 'Solo piano',
        pad: 'Ambient pad',
        jazz: 'Cafe jazz'
      })[t.k] + ' · Nook Radio';
      $('#art').style.background = `linear-gradient(135deg,${t.g[0]},${t.g[1]})`;
      $('#c2').textContent = mm(dur());
      drawL();

      if (ac) {
        if (tg) tg.gain.setTargetAtTime(0, ac.currentTime, .15);
        tg = ac.createGain();
        tg.connect(mg);
        nb = ac.currentTime + .1;
      }
    }

    function play() {
      ensure();
      if (ac.state === 'suspended') ac.resume();
      pl = true;
      if (!tg) {
        tg = ac.createGain();
        tg.connect(mg);
      }
      bi = Math.floor(pos / bar());
      nb = ac.currentTime + .1;
      mg.gain.setTargetAtTime(vol, ac.currentTime, .2);
      sched();
      setPP(1);
    }

    function pause() {
      pl = false;
      clearInterval(sch);
      if (ac) mg.gain.setTargetAtTime(0, ac.currentTime, .1);
      setPP(0);
    }

    $('#pp').onclick = () => pl ? pause() : play();
    $('#nx').onclick = () => {
      track(nxt());
      pl && play();
    };
    $('#pv').onclick = () => {
      track(ti - 1);
      pl && play();
    };
    $('#vo').oninput = e => {
      vol = +e.target.value;
      if (ac && pl) mg.gain.setTargetAtTime(vol, ac.currentTime, .05);
    };

    function musicTick(dt) {
      if (!pl) return;
      pos += dt;
      if (pos >= dur()) {
        track(nxt());
        play();
      }
      $('#pb').style.width = pos / dur() * 100 + '%';
      $('#c1').textContent = mm(pos);
    }

    const AM = {
      rain: { e: '🌧', f: [['highpass', 900], ['lowpass', 9000]], g: .35 },
      wind: { e: '🍃', f: [['lowpass', 500]], g: .5, l: [.1, .3] },
      waves: { e: '🌊', f: [['lowpass', 700]], g: .3, l: [.12, .5] },
      stream: { e: '💧', f: [['bandpass', 1600, .8]], g: .5, l: [2.5, .3] },
      fire: { e: '🔥', f: [['lowpass', 260]], g: .7, x: 'fire' },
      cafe: { e: '☕', f: [['bandpass', 800, .6]], g: .5, l: [.2, .3] },
      birds: { e: '🐦', x: 'birds' },
      crickets: { e: '🌙', x: 'cri' },
      brown: { e: '🟤', f: [['lowpass', 200]], g: .9 },
      white: { e: '⚪', f: [['highpass', 300], ['lowpass', 12000]], g: .12 }
    };
    const ax = {};

    $('#mix').innerHTML = Object.keys(AM).map(k => `<div class="ar"><button data-a="${k}">${AM[k].e} ${k}</button><input type="range" data-v="${k}" min="0" max="1" step=".01" value=".6" aria-label="${k} volume"></div>`).join('');

    function mk(k) {
      const a = AM[k],
        lv = ac.createGain(),
        st = [],
        tm = [];
      lv.gain.value = 0;
      lv.connect(ac.destination);

      if (a.f) {
        const s = ac.createBufferSource();
        s.buffer = nbuf;
        s.loop = true;
        let n = s;
        a.f.forEach(f => {
          const b = ac.createBiquadFilter();
          b.type = f[0];
          b.frequency.value = f[1];
          if (f[2]) b.Q.value = f[2];
          n.connect(b);
          n = b;
        });
        const m = ac.createGain();
        m.gain.value = a.g;
        n.connect(m);
        m.connect(lv);
        s.start();
        st.push(s);

        if (a.l) {
          const o = ac.createOscillator(),
            d = ac.createGain();
          o.frequency.value = a.l[0];
          d.gain.value = a.l[1] * a.g;
          o.connect(d);
          d.connect(m.gain);
          o.start();
          st.push(o);
        }
      }

      if (a.x === 'fire') tm.push(wInt(() => {
        if (Math.random() < .6) hit(ac.currentTime, .03 + Math.random() * .04, .5, 1800 + Math.random() * 2000, lv);
      }, 110));

      if (a.x === 'birds') tm.push(wInt(() => {
        if (Math.random() < .5) {
          const t0 = ac.currentTime,
            f0 = 2400 + Math.random() * 1800,
            n = 2 + Math.floor(Math.random() * 3);
          for (let j = 0; j < n; j++) {
            const o = ac.createOscillator(),
              g = ac.createGain(),
              t = t0 + j * .13;
            o.frequency.setValueAtTime(f0, t);
            o.frequency.exponentialRampToValueAtTime(f0 * 1.4, t + .09);
            o.connect(g);
            g.connect(lv);
            g.gain.setValueAtTime(.0001, t);
            g.gain.exponentialRampToValueAtTime(.12, t + .02);
            g.gain.exponentialRampToValueAtTime(.0001, t + .1);
            o.start(t);
            o.stop(t + .12);
          }
        }
      }, 700));

      if (a.x === 'cri') {
        [
          [4300, 16],
          [4800, 13]
        ].forEach(p => {
          const o = ac.createOscillator(),
            g = ac.createGain(),
            l = ac.createOscillator(),
            d = ac.createGain();
          o.frequency.value = p[0];
          l.frequency.value = p[1];
          d.gain.value = .05;
          g.gain.value = .05;
          l.connect(d);
          d.connect(g.gain);
          o.connect(g);
          g.connect(lv);
          o.start();
          l.start();
          st.push(o, l);
        });
      }

      return { lv, st, tm };
    }

    $('#mix').onclick = e => {
      const k = e.target.dataset.a;
      if (!k) return;
      ensure();
      if (ac.state === 'suspended') ac.resume();

      if (ax[k]) {
        const n = ax[k];
        n.lv.gain.setTargetAtTime(0, ac.currentTime, .2);
        setTimeout(() => {
          n.st.forEach(x => {
            try {
              x.stop();
            } catch (e) {}
          });
          n.tm.forEach(wClr);
          n.lv.disconnect();
        }, 1200);
        delete ax[k];
        e.target.classList.remove('on');
        return;
      }

      ax[k] = mk(k);
      ax[k].lv.gain.setTargetAtTime(+$('#mix').querySelector(`[data-v="${k}"]`).value, ac.currentTime, .3);
      e.target.classList.add('on');
    };

    $('#mix').oninput = e => {
      const k = e.target.dataset.v;
      if (k && ax[k]) ax[k].lv.gain.setTargetAtTime(+e.target.value, ac.currentTime, .05);
    };

    /* ---- ui wiring ---- */
    $('#go').onclick = start;
    $('#rs').onclick = () => setMode(mode);
    $('#pills').onclick = e => {
      if (e.target.dataset.m) setMode(e.target.dataset.m);
    };

    $('#st').onclick = () => {
      $('#sd').value = S.deep;
      $('#sb').value = S.brk;
      $('#sq').value = S.quick;
      $('#sg').value = S.bg;
      $('#sa').checked = S.auto;
      $('#sc').checked = S.chime;
      $('#sn').checked = S.nd;
      $('#md').classList.add('show');
    };

    $$('.pre button').forEach(b => b.onclick = () => {
      const p = b.dataset.p.split(',');
      $('#sd').value = p[0];
      $('#sb').value = p[1];
      $('#sq').value = p[2];
    });

    $('#md').onclick = e => {
      if (e.target.id === 'md') $('#md').classList.remove('show');
    };

    $('#sv').onclick = () => {
      const n = (id, d) => Math.max(1, parseInt($(id).value) || d);
      S = {
        deep: n('#sd', 90),
        brk: n('#sb', 20),
        quick: n('#sq', 40),
        bg: Math.max(.25, parseFloat($('#sg').value) || 1),
        auto: $('#sa').checked,
        chime: $('#sc').checked,
        nd: $('#sn').checked
      };
      sv('fn_s', S);
      $('#md').classList.remove('show');
      setMode(mode);
      bgLoop();
      applyND();
    };

    document.addEventListener('keydown', e => {
      if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') {
        e.preventDefault();
        start();
      }
    });

    const pop = id => ['#pls', '#mix'].forEach(x => $(x).classList.toggle('show', x === id && !$(x).classList.contains('show')));
    $('#ls').onclick = () => pop('#pls');
    $('#mx').onclick = () => pop('#mix');
    $('#sh').style.opacity = .55;
    $('#sh').onclick = e => {
      shuf = !shuf;
      e.currentTarget.style.opacity = shuf ? 1 : .55;
    };

    track(0);
    draw();

    /* ---- custom video / image backgrounds ---- */
    let manual = null,
      vmode = false,
      bgList = BACKGROUNDS.slice(),
      bgi = -1,
      vcur = 0,
      lastT = performance.now(),
      bgAcc = 0;

    const VL = [$('#v0'), $('#v1')],
      isImg = u => /\.(jpe?g|png|gif|webp|avif|svg)(\?.*)?$/i.test(u);

    function showBg() {
      if (!bgList.length) {
        manual = null;
        vmode = false;
        cv.style.display = 'block';
        VL.forEach(l => {
          l.style.opacity = 0;
          l.innerHTML = '';
        });
        return;
      }

      if (bgList.length === 1 && bgi === 0) return;

      bgi = SHUFFLE && bgList.length > 1 ? (bgi + 1 + Math.floor(Math.random() * (bgList.length - 1))) % bgList.length : (bgi + 1) % bgList.length;
      const e = bgList[bgi],
        u = typeof e === 'string' ? e : e.src,
        n = VL[1 - vcur],
        o = VL[vcur],
        v = !isImg(u),
        el = v ? document.createElement('video') : new Image();

      if (v) {
        el.muted = true;
        el.loop = true;
        el.autoplay = true;
        el.playsInline = true;
        el.preload = 'auto';
      }
      n.innerHTML = '';
      n.appendChild(el);

      el.addEventListener(v ? 'loadeddata' : 'load', () => {
        n.style.opacity = 1;
        o.style.opacity = 0;
        vcur = 1 - vcur;
        vmode = true;
        manual = e.color ? hs(e.color) : null;
        if (v) el.play().catch(() => {});
        setTimeout(() => {
          if (vmode) cv.style.display = 'none';
        }, 3200);
      }, { once: true });

      el.addEventListener('error', () => {
        console.warn('Background not found or unsupported:', u);
        bgList.splice(bgi, 1);
        bgi--;
        showBg();
      }, { once: true });

      el.src = u;
    }

    function bgLoop() {
      bgAcc = 0;
    }

    function tickAll() {
      const n = performance.now(),
        dt = Math.min((n - lastT) / 1000, 3600);
      lastT = n;
      ph = (ph + dt / (S.bg * 60)) % 5;

      if (bgList.length > 1) {
        bgAcc += dt;
        if (bgAcc >= S.bg * 60) {
          bgAcc = 0;
          showBg();
        }
      }
      timerTick();
      if (pl && ac) sched();
      musicTick(dt);
      colorTick();
    }

    wInt(tickAll, 200);

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) VL.forEach(l => {
        const v = l.querySelector('video');
        v && v.play().catch(() => {});
      });
    });

    $('.ov').style.setProperty('--ov', OVERLAY);
    showBg();
    bgLoop();

    /* ---- player extras: icons, seek, visualizer ---- */
    let an, fd;
    const IP = document.querySelector('#pp').innerHTML,
      IZ = '<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';

    function setPP(on) {
      $('#pp').innerHTML = on ? IZ : IP;
      $('#art').classList.toggle('on', !!on);
    }

    function paintPos() {
      $('#pb').style.width = pos / dur() * 100 + '%';
      $('#c1').textContent = mm(pos);
    }

    function seek(f) {
      pos = Math.max(0, Math.min(.999, f)) * dur();
      if (ac && pl) {
        tg.gain.setTargetAtTime(0, ac.currentTime, .08);
        tg = ac.createGain();
        tg.connect(mg);
        bi = Math.floor(pos / bar());
        nb = ac.currentTime + .1;
      }
      paintPos();
    }

    $('#bar').onclick = e => {
      const r = e.currentTarget.getBoundingClientRect();
      seek((e.clientX - r.left) / r.width);
    };

    const vzc = $('#vz'),
      vx = vzc.getContext('2d'),
      vb = Array(12).fill(0);

    function vzDraw() {
      requestAnimationFrame(vzDraw);
      if (document.hidden) return;
      const W = vzc.width,
        H = vzc.height;
      vx.clearRect(0, 0, W, H);
      if (an && pl) an.getByteFrequencyData(fd);
      vx.fillStyle = `hsl(${cH},${cS*100}%,84%)`;
      for (let i = 0; i < 12; i++) {
        const t = an && pl ? fd[i + 1] / 255 : 0;
        vb[i] += (t - vb[i]) * .25;
        const h = Math.max(3, vb[i] * H * 1.15);
        vx.beginPath();
        vx.roundRect(i * (W / 12) + 1, H - h, W / 12 - 3, h, 2);
        vx.fill();
      }
    }

    /* ---- auto colour from the current background ---- */
    function rgb2hs(r, g, b) {
      const mx = Math.max(r, g, b),
        mn = Math.min(r, g, b),
        d = mx - mn,
        l = (mx + mn) / 2;
      let h = 0;
      if (d) {
        h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
        h = (h * 60 + 360) % 360;
      }
      return [h, d ? d / (1 - Math.abs(2 * l - 1)) : 0];
    }

    function hs(c) {
      const n = parseInt(c.replace('#', ''), 16);
      return rgb2hs((n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255);
    }

    let tH = 210,
      tS = .5,
      cH = 210,
      cS = .5,
      smN = 0;
    const smp = document.createElement('canvas'),
      sx = smp.getContext('2d', { willReadFrequently: true });
    smp.width = 24;
    smp.height = 14;

    function sampleBg() {
      if (manual) {
        [tH, tS] = manual;
        return;
      }
      try {
        const el = vmode ? VL[vcur].firstChild : cv;
        if (!el || (el.tagName === 'VIDEO' && el.readyState < 2)) return;
        sx.drawImage(el, 0, 0, 24, 14);
        const d = sx.getImageData(0, 0, 24, 14).data;
        let R = 0,
          G = 0,
          B = 0,
          Wt = 0;
        for (let i = 0; i < d.length; i += 4) {
          const w = .2 + (Math.max(d[i], d[i + 1], d[i + 2]) - Math.min(d[i], d[i + 1], d[i + 2])) / 255;
          R += d[i] * w;
          G += d[i + 1] * w;
          B += d[i + 2] * w;
          Wt += w;
        }
        const [h, s] = rgb2hs(R / Wt / 255, G / Wt / 255, B / Wt / 255);
        tH = h;
        tS = Math.min(.7, Math.max(.3, s * 1.25));
      } catch (e) {}
    }

    function colorTick() {
      if (document.hidden) return;
      if (smN++ % 5 === 0) sampleBg();
      cH = (cH + (((tH - cH + 540) % 360) - 180) * .08 + 360) % 360;
      cS += (tS - cS) * .08;
      const r = document.documentElement.style;
      r.setProperty('--ah', cH.toFixed(1));
      r.setProperty('--as', (cS * 100).toFixed(1) + '%');
      r.setProperty('--ink', `hsl(${cH.toFixed(0)},45%,20%)`);
    }

    /* ---- no distraction mode ---- */
    function applyND() {
      document.body.classList.toggle('nd', !!S.nd);
    }

    sampleBg();
    cH = tH;
    cS = tS;
    setPP(0);
    applyND();
    vzDraw();
  </script>
</body>
</html>
